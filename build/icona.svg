<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- CACCA: cacchina fumettosa con visiera da contabile, occhiali e calcolatrice -->

  <!-- ombra a terra -->
  <ellipse cx="256" cy="472" rx="180" ry="24" fill="#000000" opacity="0.12"/>

  <!-- corpo: tre piani + ricciolo -->
  <g>
    <ellipse cx="256" cy="392" rx="188" ry="88" fill="#8a5a3b" stroke="#5f3b22" stroke-width="10"/>
    <ellipse cx="256" cy="304" rx="150" ry="80" fill="#966542" stroke="#5f3b22" stroke-width="10"/>
    <ellipse cx="256" cy="222" rx="108" ry="66" fill="#a06f4a" stroke="#5f3b22" stroke-width="10"/>
    <!-- ricciolo in punta -->
    <path d="M256 96
             C 300 96, 322 126, 306 152
             C 296 168, 274 172, 260 164
             C 250 158, 248 146, 256 140
             C 236 138, 220 150, 222 170
             L 186 178
             C 178 138, 210 96, 256 96 Z"
          fill="#a06f4a" stroke="#5f3b22" stroke-width="10" stroke-linejoin="round"/>
    <!-- luci morbide -->
    <ellipse cx="180" cy="376" rx="46" ry="20" fill="#b5825c" opacity="0.55"/>
    <ellipse cx="196" cy="298" rx="34" ry="16" fill="#c08a60" opacity="0.5"/>
  </g>

  <!-- visiera verde da contabile -->
  <g>
    <path d="M150 190 Q 256 128 362 190 L 338 214 Q 256 162 174 214 Z"
          fill="#2f7d43" stroke="#1d5a2e" stroke-width="9" stroke-linejoin="round"/>
    <path d="M174 214 Q 256 162 338 214 L 330 224 Q 256 178 182 224 Z"
          fill="#3f9c57" opacity="0.85"/>
  </g>

  <!-- occhi + occhiali tondi -->
  <g>
    <circle cx="212" cy="268" r="34" fill="#ffffff" stroke="#4a2c16" stroke-width="9"/>
    <circle cx="300" cy="268" r="34" fill="#ffffff" stroke="#4a2c16" stroke-width="9"/>
    <line x1="246" y1="268" x2="266" y2="268" stroke="#4a2c16" stroke-width="9" stroke-linecap="round"/>
    <line x1="178" y1="264" x2="152" y2="252" stroke="#4a2c16" stroke-width="9" stroke-linecap="round"/>
    <line x1="334" y1="264" x2="360" y2="252" stroke="#4a2c16" stroke-width="9" stroke-linecap="round"/>
    <circle cx="218" cy="274" r="12" fill="#2b1a0e"/>
    <circle cx="306" cy="274" r="12" fill="#2b1a0e"/>
    <circle cx="222" cy="269" r="4" fill="#ffffff"/>
    <circle cx="310" cy="269" r="4" fill="#ffffff"/>
  </g>

  <!-- guance + sorriso -->
  <ellipse cx="188" cy="316" rx="16" ry="10" fill="#c96f5e" opacity="0.6"/>
  <ellipse cx="324" cy="316" rx="16" ry="10" fill="#c96f5e" opacity="0.6"/>
  <path d="M212 330 Q 256 362 300 330" fill="none" stroke="#4a2c16" stroke-width="10" stroke-linecap="round"/>

  <!-- braccino destro appoggiato -->
  <path d="M398 330 Q 442 344 434 382 Q 428 404 402 398"
        fill="#966542" stroke="#5f3b22" stroke-width="10" stroke-linecap="round"/>

  <!-- braccino sinistro che regge la calcolatrice -->
  <path d="M118 330 Q 76 344 84 380"
        fill="none" stroke="#5f3b22" stroke-width="26" stroke-linecap="round"/>
  <path d="M118 330 Q 80 342 86 376"
        fill="none" stroke="#966542" stroke-width="14" stroke-linecap="round"/>

  <!-- calcolatrice -->
  <g transform="rotate(-10 96 408)">
    <rect x="34" y="344" width="124" height="150" rx="16" fill="#eceff1" stroke="#37474f" stroke-width="9"/>
    <rect x="50" y="362" width="92" height="34" rx="6" fill="#c8e6c9" stroke="#37474f" stroke-width="6"/>
    <text x="136" y="388" font-family="Consolas, monospace" font-size="26" font-weight="bold" fill="#1b5e20" text-anchor="end">25,10</text>
    <g fill="#546e7a">
      <rect x="50" y="408" width="24" height="18" rx="4"/>
      <rect x="84" y="408" width="24" height="18" rx="4"/>
      <rect x="118" y="408" width="24" height="18" rx="4"/>
      <rect x="50" y="434" width="24" height="18" rx="4"/>
      <rect x="84" y="434" width="24" height="18" rx="4"/>
      <rect x="118" y="434" width="24" height="18" rx="4" fill="#ef6c00"/>
      <rect x="50" y="460" width="58" height="18" rx="4"/>
      <rect x="118" y="460" width="24" height="18" rx="4" fill="#2e7d32"/>
    </g>
  </g>
</svg>
